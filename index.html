<!DOCTYPE html>
<html lang="pl">
<head>
    <meta name="google-adsense-account" content="ca-pub-2855961187559150">

      <meta charset="UTF-8">

    <title>Auto News 24 – Aktualne wiadomości</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f4f4f4; 
            margin: 0; 
            padding: 0;
        }
        header {
            background: #111;
            color: #fff;
            padding: 25px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        nav {
            background: #222;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: #fff;
            margin: 0 15px;
            text-decoration: none;
            font-size: 16px;
        }
        .ad-top {
            max-width:1000px;
            margin:20px auto;
            padding:10px;
            background:#fff;
            border-radius:10px;
            text-align:center;
            border:1px dashed #ccc;
        }
        .ad-top p {
            color:#888;
            font-size:14px;
            margin:0;
        }
        .container {
            max-width: 1000px;
            margin: 25px auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        article {
            border-bottom: 1px solid #ddd;
            padding: 20px 0;
            display: flex;
            gap: 20px;
        }
        article:last-child {
            border-bottom: none;
        }
        img {
            width: 180px;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
        }
        h2 {
            margin: 0 0 10px;
            font-size: 22px;
        }
        p {
            margin: 0 0 10px;
            color: #444;
        }
        a.read-more {
            color: #0077cc;
            font-weight: bold;
            text-decoration: none;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #111;
            color: #fff;
            margin-top: 40px;
        }
        @media(max-width: 700px) {
            article {
                flex-direction: column;
            }
            img {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>

<body>

<header>Auto News 24</header>

<nav>
    <a href="#">Wiadomości</a>
    <a href="#">Motoryzacja</a>
    <a href="#">Sport</a>
    <a href="#">Technologia</a>
</nav>

<div class="ad-top">
    <p>[Tu pojawi się reklama Google AdSense po zatwierdzeniu]</p>
</div>

<div class="container" id="news"></div>

<footer>
    © 2026 Auto News 24 – Aktualizowane automatycznie
</footer>

<script>
async function loadRSS() {
    const feeds = [
        "https://www.rmf24.pl/feed",
        "https://tvn24.pl/najnowsze.xml",
        "https://www.polsatnews.pl/rss/wszystkie/"
    ];

    const container = document.getElementById("news");

    for (const url of feeds) {
        try {
            const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
            const data = await response.json();

            data.items.forEach(item => {
                const article = document.createElement("article");

                const image = item.thumbnail ? `<img src="${item.thumbnail}" alt="news image">` : `<img src="https://via.placeholder.com/180x120?text=Brak+zdjęcia">`;

                article.innerHTML = `
                    ${image}
                    <div>
                        <h2>${item.title}</h2>
                        <p>${item.description || ""}</p>
                        <a class="read-more" href="${item.link}" target="_blank">Czytaj dalej</a>
                    </div>
                `;
                container.appendChild(article);
            });
        } catch (e) {
            console.error("RSS error:", e);
        }
    }
}

loadRSS();
</script>

</body>
</html>
