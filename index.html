<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Auto News 24 – Aktualne wiadomości</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial; background: #f4f4f4; margin: 0; }
        header { background: #222; color: #fff; padding: 20px; text-align: center; }
        .container { max-width: 900px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 10px; }
        article { border-bottom: 1px solid #ddd; padding: 15px 0; }
        article:last-child { border-bottom: none; }
        h2 { margin: 0 0 10px; }
        a { color: #0077cc; text-decoration: none; }
    </style>
</head>
<body>

<header>
    <h1>Auto News 24</h1>
    <p>Strona aktualizuje się automatycznie</p>
</header>

<div class="container" id="news"></div>

<script>
async function loadRSS() {
    const feeds = [
        "https://www.rmf24.pl/feed",
        "https://tvn24.pl/najnowsze.xml",
        "https://www.polsatnews.pl/rss/wszystkie/"
    ];

    const container = document.getElementById("news");

    for (const url of feeds) {
        try {
            const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
            const data = await response.json();
            const parser = new DOMParser();
            const xml = parser.parseFromString(data.contents, "text/xml");
            const items = xml.querySelectorAll("item");

            items.forEach(item => {
                const title = item.querySelector("title")?.textContent;
                const link = item.querySelector("link")?.textContent;
                const description = item.querySelector("description")?.textContent;

                const article = document.createElement("article");
                article.innerHTML = `
                    <h2>${title}</h2>
                    <p>${description || ""}</p>
                    <a href="${link}" target="_blank">Czytaj dalej</a>
                `;
                container.appendChild(article);
            });
        } catch (e) {
            console.error("RSS error:", e);
        }
    }
}

loadRSS();
</script>

</body>
</html>
